server {
    listen 8088;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 所有未命中檔案的路徑導回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源快取
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
