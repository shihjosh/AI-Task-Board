name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint

      - name: Frontend tests
        run: npx vitest run

      - name: Backend integration tests
        run: node --test "test/**/*.test.mjs"

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t ai-task-board:ci .
